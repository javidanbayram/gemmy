<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>See you later! 💎</title>
  <meta name="description" content="Come back for day 5 later." />

  <!-- Google Fonts: Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  <style>
    .message-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: linear-gradient(145deg, rgba(30, 16, 64, 0.96) 0%, rgba(20, 8, 44, 0.98) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: var(--radius-xl);
      padding: 60px 40px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 80px rgba(168, 85, 247, 0.25);
      z-index: 100;
      width: 90%;
      max-width: 500px;
    }
    .message-container h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--clr-pearl);
      margin-bottom: 15px;
      text-shadow: 0 0 30px rgba(192, 132, 252, 0.5);
    }
    .message-container p {
      font-size: 1.2rem;
      color: var(--clr-lavender);
    }
    .sparkle-decor {
      font-size: 3rem;
      margin-bottom: 20px;
      animation: floatSparkle 3s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes floatSparkle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <!-- AMBIENT BACKGROUND ORBS -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>

  <!-- SWEET DESIGNED MESSAGE -->
  <div class="message-container">
    <div class="sparkle-decor">✨</div>
    <h1>Come back for day 5 later</h1>
    <p>We are preparing your next treasure!</p>
  </div>

</body>
</html>
